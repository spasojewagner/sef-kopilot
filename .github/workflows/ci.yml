name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per branch at a time; a newer push cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  FORCE_COLOR: "1"

jobs:
  # Every hook from .pre-commit-config.yaml, on every file: hygiene, ruff, uv.lock, mypy,
  # ESLint, Prettier, gitleaks (staged-file mode). This is the same gate developers get locally.
  lint:
    name: pre-commit (all files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Install Python workspace
        run: uv sync --all-packages --locked

      - name: Install Node workspace
        run: pnpm install --frozen-lockfile

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit on all files
        env:
          # The branch guard only makes sense for local commits.
          SKIP: no-commit-to-branch
        run: uv run pre-commit run --all-files --show-diff-on-failure --color=always

  core:
    name: einvoice_core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python workspace
        run: uv sync --all-packages --locked

      # Rule sets are pinned by the manifest, so its hash is a complete cache key: a cache hit
      # holds exactly the files a fresh fetch would produce. A miss (manifest changed, or the
      # cache expired) downloads from the official sources and re-verifies every pin. The
      # stylesheets compiled from Schematron sources are left out, so that every run compiles
      # the Peppol rules from source.
      - name: Cache fetched rule sets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            third_party/*
            !third_party/README.md
            !third_party/manifest.json
            !third_party/_compiled
          key: rulesets-${{ hashFiles('third_party/manifest.json') }}

      # The UBL schemas, the rule sets and the official CEN and OpenPeppol examples and unit
      # tests are part of the test suite.
      - name: Fetch rule sets (UBL 2.1, EN 16931, Peppol BIS, ISO Schematron)
        run: python scripts/fetch_rulesets.py

      - name: Verify pinned versions
        run: python scripts/fetch_rulesets.py --check

      - name: Test with coverage gate (>= 90 %)
        run: >-
          uv run pytest packages/einvoice_core
          --cov=einvoice_core --cov-report=term-missing --cov-report=xml:coverage-core.xml
          --cov-fail-under=90

  api:
    name: api tests
    runs-on: ubuntu-latest
    # PostgreSQL 16 with pgvector and Redis, the images of infra/docker-compose.yml. The test
    # suite creates and drops its own databases on the PostgreSQL server, and the migrations step
    # uses sef_kopilot; the worker tests empty Redis database 15.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sef
          POSTGRES_PASSWORD: sef
          POSTGRES_DB: sef_kopilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sef -d sef_kopilot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://sef:sef@localhost:5432/sef_kopilot
      SEF_TEST_DATABASE_URL: postgresql+asyncpg://sef:sef@localhost:5432/postgres
      SEF_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python workspace
        run: uv sync --all-packages --locked

      # The validator behind the invoice endpoints needs the UBL schemas and the rule sets,
      # fetched as in the core job and from the same cache.
      - name: Cache fetched rule sets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            third_party/*
            !third_party/README.md
            !third_party/manifest.json
            !third_party/_compiled
          key: rulesets-${{ hashFiles('third_party/manifest.json') }}

      - name: Fetch rule sets (UBL 2.1, EN 16931, Peppol BIS, ISO Schematron)
        run: python scripts/fetch_rulesets.py

      - name: Migrations apply, undo one step and apply again
        run: |
          uv run alembic -c apps/api/alembic.ini upgrade head
          uv run alembic -c apps/api/alembic.ini downgrade -1
          uv run alembic -c apps/api/alembic.ini upgrade head

      # By path: Alembic runs env.py and the revisions as standalone modules, which a package
      # name (--cov=sef_api) does not match.
      - name: Test with coverage gate (>= 80 %)
        run: >-
          uv run pytest apps/api
          --cov=apps/api/src/sef_api --cov-report=term-missing --cov-report=xml:coverage-api.xml
          --cov-fail-under=80

      - name: Test the helper scripts
        run: uv run pytest scripts

  web:
    name: web lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Node workspace
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint, zero warnings)
        run: pnpm --filter @sef-kopilot/web lint

      - name: Type-check (tsc --noEmit)
        run: pnpm --filter @sef-kopilot/web typecheck

      - name: Unit tests (Vitest)
        run: pnpm --filter @sef-kopilot/web test

      - name: Production build
        run: pnpm --filter @sef-kopilot/web build

  # The golden path in a browser (ADR-0033): the web application's production build against the
  # API, which starts on a database of its own with a scripted language model, so that no key is
  # needed. One test, in Chromium; when it fails, its report and its trace are kept.
  e2e:
    name: end-to-end smoke test (Playwright)
    runs-on: ubuntu-latest
    # The PostgreSQL server of the api job, on which the API makes its database, sef_e2e; its
    # jobs run in its own process, so it needs no Redis.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sef
          POSTGRES_PASSWORD: sef
          POSTGRES_DB: sef_kopilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sef -d sef_kopilot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      SEF_TEST_DATABASE_URL: postgresql+asyncpg://sef:sef@localhost:5432/postgres
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Python workspace
        run: uv sync --all-packages --locked

      - name: Install Node workspace
        run: pnpm install --frozen-lockfile

      # The API's validator needs the UBL schemas and the rule sets, fetched as in the core job
      # and from the same cache.
      - name: Cache fetched rule sets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            third_party/*
            !third_party/README.md
            !third_party/manifest.json
            !third_party/_compiled
          key: rulesets-${{ hashFiles('third_party/manifest.json') }}

      - name: Fetch rule sets (UBL 2.1, EN 16931, Peppol BIS, ISO Schematron)
        run: python scripts/fetch_rulesets.py

      # The headless Chromium of the Playwright version the lock file pins, with the system
      # libraries it needs.
      - name: Install Chromium for Playwright
        run: pnpm --filter @sef-kopilot/web exec playwright install --with-deps --only-shell chromium

      - name: Walk the golden path (upload, report, repair, approval)
        run: pnpm --filter @sef-kopilot/web e2e

      - name: Keep the report and the trace of a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14

  # The API's image (ADR-0034), built as a deployment builds it, then started on an empty
  # database, which its migrations fill, and asked whether it is ready and to validate an invoice.
  container:
    name: API image (build, start, validate)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sef
          POSTGRES_PASSWORD: sef
          POSTGRES_DB: sef_kopilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sef -d sef_kopilot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Not the rule sets the other jobs cache: the build is given what a clone of the repository
      # holds, as Render's is, and fetches them from their official sources itself. A cache here
      # once hid that it could not.
      - name: Check that the build is given no rule sets
        run: test -z "$(git ls-files --others third_party)"

      - name: Build the image
        run: docker build -f apps/api/Dockerfile -t sef-kopilot-api:ci .

      - name: Start it as a deployment does, and wait until it is ready
        run: |
          docker run -d --name api --network host \
            -e DATABASE_URL=postgresql+asyncpg://sef:sef@localhost:5432/sef_kopilot \
            -e SEF_JWT_SECRET="$(openssl rand -hex 32)" \
            sef-kopilot-api:ci
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/ready; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Register, and validate an invoice through it
        run: |
          token=$(curl -fsS -X POST http://127.0.0.1:8000/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email": "ci@primer.example", "password": "a long passphrase for CI", "organization_name": "Primer d.o.o."}' \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["access_token"])')
          curl -fsS -X POST 'http://127.0.0.1:8000/invoices/validate?profile=srb' \
            -H "Authorization: Bearer ${token}" -H 'Content-Type: application/xml' \
            --data-binary @fixtures/invoices/synthetic/srb-final-invoice.xml \
            | python3 -c 'import json, sys; report = json.load(sys.stdin); assert report["valid"], report'

      - name: The container's log and the image's size
        if: always()
        run: |
          docker logs api || true
          docker image ls sef-kopilot-api:ci

  # Full-history secret scan, independent of pre-commit: a secret that slipped into an old
  # commit is still a leak even if the current tree is clean.
  gitleaks:
    name: gitleaks (git history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned release, checksum verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum --check --strict
          tar -xzf gitleaks.tgz gitleaks
          rm gitleaks.tgz

      - name: Scan every commit
        run: ./gitleaks git . --no-banner --redact --exit-code 1

  # Known-vulnerability audit of the locked dependency sets.
  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Audit Python dependencies (pip-audit against uv.lock)
        run: |
          uv export --all-packages --locked --no-emit-workspace --no-hashes --format requirements-txt -o requirements-audit.txt
          uvx pip-audit --strict --no-deps --requirement requirements-audit.txt

      - name: Audit Node dependencies (pnpm audit, high and above)
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=high
