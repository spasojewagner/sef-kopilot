name: Feature request
description: Propose a capability, a rule, or an integration.
title: "feat: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today? Who is affected (accountant, ERP vendor, operator)?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should happen instead? If it concerns a rule, cite the regulation or specification paragraph.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - core (validator, rules, patches, CLI)
        - api
        - web
        - rag (explanations, citations)
        - repair
        - sef
        - mcp
        - evals
        - infra / ci
        - docs
    validations:
      required: true
