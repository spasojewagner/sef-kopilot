packages:
  - "apps/web"

# Supply-chain cooldown: a package version must be at least one day old before pnpm will
# resolve it, which keeps freshly published (possibly compromised) releases out of the lock file.
minimumReleaseAge: 1440

# Every install script of a dependency is ruled on here: pnpm 11 and later fail an install that
# meets one that is not, and `allowBuilds` replaced the earlier lists. None runs: sharp and
# unrs-resolver ship prebuilt binaries for each platform, and SWC and the file watcher come with
# next-intl's message extractor, which the web application does not use.
allowBuilds:
  "@parcel/watcher": false
  "@swc/core": false
  sharp: false
  unrs-resolver: false
