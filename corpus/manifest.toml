# The official documents of the corpus and their editions (ADR-0020).
#
# Written by hand and reviewed like code. Each edition names its source by URL and by the
# SHA-256 digest of what that URL returned on `fetched_at`; `scripts/build_corpus.py` downloads
# the sources into corpus/raw/ (ignored by Git), checks the digests and writes each edition's
# Markdown file, which is never edited by hand. `valid_from` is the day the edition applies
# from; `deferred` lists its passages that apply later, as its amending act's final provisions
# say (with `partly`, the passage applies from the edition's day and some of its provisions
# later); `renumbered` maps passages of the edition before it to the numbers this one gives them.
#
# Titles, publishers and versions are written as the validator's sources write them
# (einvoice_core.srb.sources); the text of the documents is kept as they print it, in Cyrillic.

