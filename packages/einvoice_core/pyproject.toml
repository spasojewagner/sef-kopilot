[project]
name = "einvoice-core"
version = "0.1.0"
description = "Deterministic validation engine for UBL 2.1 e-invoices: XSD, EN 16931 and Peppol BIS Schematron, SRB-CIUS rules, patch engine and CLI."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Marko Spasojevic", email = "markospasojevic758@gmail.com" }]
keywords = ["e-invoicing", "UBL", "EN 16931", "Peppol", "Schematron", "SEF", "SRB-CIUS"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Accounting",
  "Typing :: Typed",
]
dependencies = [
  "lxml>=6.1",
  "pydantic>=2.14",
  "saxonche>=13.1",
]

[project.scripts]
einvoice = "einvoice_core.cli:console"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/einvoice_core"]
