# Local infrastructure for development and tests: PostgreSQL 16 with pgvector, and Redis.
#
#   make up        docker compose --project-directory . -f infra/docker-compose.yml up -d --wait
#   make down      ... down (keeps the database volume; add --volumes to wipe it)
#
# Variables come from the repository-root .env (copy .env.example) or fall back to the defaults
# below. Production uses managed services (Neon, Upstash); this file is never deployed.

name: sef-kopilot

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: sef-kopilot-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sef}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sef}
      POSTGRES_DB: ${POSTGRES_DB:-sef_kopilot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Runs once, when the data volume is first created: enables pgvector and pg_trgm.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-sef} -d ${POSTGRES_DB:-sef_kopilot}",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: sef-kopilot-redis
    # The queue is ephemeral locally; persistence is switched off on purpose.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  db-data:
