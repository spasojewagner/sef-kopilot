# Workspace root.
#
# This is a *virtual* uv project: it has no [project] table and is never built or published.
# It exists to hold the workspace definition, the shared development dependencies and the
# shared tool configuration (ruff, mypy, pytest, coverage) so that every package in the
# monorepo is checked the same way. See docs/adr/0001-monorepo-and-tooling.md.

[tool.uv.workspace]
members = ["apps/api", "packages/einvoice_core", "evals"]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
  # Pinned exactly so that the pre-commit hook and the local run use the same ruff.
  "ruff==0.17.4",
  "mypy==2.4.1",
  "pytest>=9.2",
  "pytest-asyncio>=1.4",
  "pytest-cov>=7.1",
  "hypothesis>=6.170.15",
  "httpx>=0.28",
  "pre-commit>=4.7",
  "types-lxml>=2026.2.16",
  "types-pyyaml>=6.0.12",
  # Reads the official PDFs of the corpus (scripts/build_corpus.py); the API does not need it.
  "pdfplumber>=0.11.10",
]

# ---------------------------------------------------------------------------
# ruff: linter and formatter (replaces flake8, isort, pyupgrade, black)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/einvoice_core/src", "apps/api/src", "evals/src", "scripts", "scripts/hooks"]
extend-exclude = ["third_party", "apps/web"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "N",        # pep8-naming
  "UP",       # pyupgrade
  "B",        # flake8-bugbear
  "A",        # flake8-builtins
  "C4",       # flake8-comprehensions
  "DTZ",      # flake8-datetimez (no naive datetimes)
  "T20",      # flake8-print (no stray prints)
  "PT",       # flake8-pytest-style
  "RET",      # flake8-return
  "SIM",      # flake8-simplify
  "ARG",      # flake8-unused-arguments
  "PL",       # pylint
  "RUF",      # ruff-specific rules
]
ignore = [
  "PLR0913",  # too many arguments: Pydantic models and FastAPI handlers need them
]

[tool.ruff.lint.per-file-ignores]
# Magic values, unused fixture arguments and many positional parameters (pytest.mark.parametrize)
# are normal in tests.
"**/tests/**" = ["PLR2004", "ARG001", "PLR0917"]
"scripts/**" = ["T201"]                 # command-line scripts print by design
# Serbian is written in Cyrillic, whose letters ruff takes for their Latin look-alikes; the code
# that reads and writes the corpus of Serbian regulations holds them on purpose.
"apps/api/src/sef_api/rag/**" = ["RUF001", "RUF002", "RUF003"]
"apps/api/tests/test_corpus*.py" = ["RUF001", "RUF002", "RUF003"]
"apps/api/tests/test_explainer.py" = ["RUF001", "RUF002", "RUF003"]
"apps/api/tests/test_invoices_explain.py" = ["RUF001", "RUF002", "RUF003"]
"scripts/build_corpus.py" = ["RUF001", "RUF002", "RUF003"]
"scripts/tests/test_build_corpus.py" = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["einvoice_core", "sef_api", "sef_evals"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy: strict static typing for every Python package in the workspace
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
files = ["packages/einvoice_core", "apps/api", "evals", "scripts"]
# Module names are derived from these bases (closest wins), so the two `tests/conftest.py`
# files and the editable-installed packages each get exactly one, unique module name.
explicit_package_bases = true
# `packages/einvoice_core/stubs` holds type information for dependencies that ship none.
mypy_path = "packages/einvoice_core/src:packages/einvoice_core/stubs:apps/api/src:evals/src:scripts:scripts/hooks"
exclude = ["third_party/", "node_modules/", "\\.venv/"]

# ---------------------------------------------------------------------------
# pytest and coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["packages/einvoice_core/tests", "apps/api/tests", "evals/tests", "scripts/tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
pythonpath = ["scripts", "scripts/hooks"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
filterwarnings = [
  "error",
  # arq 0.28 closes its Redis connections with the method redis-py 5 renamed to aclose.
  "ignore:Call to deprecated close:DeprecationWarning:arq",
]
markers = [
  "conformance: applies the fetched third-party rule sets to their published unit tests and examples; deselect with -m 'not conformance'",
]

[tool.coverage.run]
branch = true
# SQLAlchemy's asyncio layer runs the ORM in greenlets; without this, lines after an awaited
# database call are reported as not executed.
concurrency = ["thread", "greenlet"]
# The API validates invoices in a child process; measure it too.
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
  "if __name__ == \"__main__\":",
]
