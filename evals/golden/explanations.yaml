# The golden set of the explanations' evaluations (ADR-0055). Every rule that a document below
# breaks under SRB-CIUS is explained by the model, in each language, as the API explains a
# report, on the day named, which dates the passages that apply.
#
# `rules` labels, for each rule, the passages retrieval finds for it: relevant, or not. A passage
# is relevant to a rule when it is one of the passages the rule is authored from, or defines a
# business term or group that the rule's statement names, by its id or in words (for the
# schema's violations, which name none, the element each concerns); a passage about a
# neighbouring field is not. A citation of a passage that no label names counts against the
# relevance of citations, so that the labels keep up with retrieval: `uv run sef-evals
# --unlabelled` lists the passages to label. The labels were proposed from the rules'
# statements and the passages' text and are reviewed by the maintainer.
#
# The unreadable documents are left out: no passage concerns a document that is not XML.

