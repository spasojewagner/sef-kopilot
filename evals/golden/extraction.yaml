# The reading's golden set (ADR-0063): synthetic invoices, by the fields they print, each
# printed by scripts/render_documents.py into evals/golden/documents/ as a PDF with its text
# (<name>.pdf), a scan (<name>.scan.pdf) and a photograph (<name>.jpg), in one of two layouts.
#
# The fields are what reading a document must give, in the form of the API's InvoiceFields:
# amounts with a decimal point, dates as YYYY-MM-DD, units and categories as codes; null where
# the invoice prints nothing, which the reading must leave empty. The country, which a Serbian
# invoice does not print, is RS, as the reading is told to write it. Every case's fields make an
# invoice the validator accepts (evals/tests/test_extraction.py), so a reading that does not is
# the reading's fault. The companies, their PIBs (with valid check digits) and their accounts
# are made up.

