[project]
name = "sef-kopilot-evals"
version = "0.5.0"
description = "Evaluations of SEF Kopilot: golden sets, a runner and the thresholds that gate CI."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Marko Spasojevic", email = "markospasojevic758@gmail.com" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Private :: Do Not Upload",
]
dependencies = [
  "einvoice-core",
  "pydantic>=2.14",
  "pyyaml>=6.0.3",
]

[project.scripts]
sef-evals = "sef_evals.cli:console"

[tool.uv.sources]
einvoice-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sef_evals"]
