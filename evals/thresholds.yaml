# The thresholds the evaluations must meet (ADR-0054). Each names a measure of the runner
# (evals/README.md), with `min` for a share that must be at least so high and `max` for a rate
# that must be at most so low, from 0 to 1. A threshold whose measure is not taken is not met.
#
# The validator is deterministic, so its thresholds allow no exception: one document that it
# judges otherwise than the reference, or accepts when it must reject, is a defect to fix. The
# language model's thresholds leave room for its variance, save the one that keeps a repair
# from deciding what a person decides.

# Verdicts as the published rule sets give them, applied as published (ADR-0054).
agreement: { min: 1.0 }
# The same fatal rules as the reference, save what it reports inside the extension (ADR-0007).
rule_agreement: { min: 1.0 }
# No document that must be rejected is accepted.
false_accept_rate: { max: 0.0 }
# No document that must be accepted is rejected.
false_reject_rate: { max: 0.0 }
# Every mistake of the golden set is reported by the rules it must be reported by.
detection: { min: 1.0 }

# The language model's explanations (ADR-0055), replayed from evals/cassettes/.
# A rule left unexplained leaves the person with the rule's message alone.
explained: { min: 0.9 }
# Every citation names a stored passage that applies on the day: the brief's guardrail.
citation_resolution: { min: 1.0 }
# Citations of a passage labelled relevant to the rule: the brief's 90 %.
citation_relevance: { min: 0.9 }

# The language model's repairs (ADR-0056), replayed from evals/cassettes/.
# Held-out invoices a repair leaves the validator accepting: the brief's 80 %.
repair_success: { min: 0.8 }
# No repair makes an invoice pass whose mistake a person decides.
overreach_rate: { max: 0.0 }

# The reading of invoices from PDFs and pictures (ADR-0063), replayed from evals/cassettes/.
# Set before the first recording, as the floor the beta must clear: a PDF gives its text, so
# it is read nearly whole; a scan and a photograph are read from their pixels alone.
extraction_pdf: { min: 0.97 }
extraction_scan: { min: 0.95 }
extraction_photo: { min: 0.9 }
# The reading does not guess: what an invoice leaves empty is left empty.
extraction_invented: { max: 0.05 }
# Documents made into an invoice the validator accepts without a person's correction; the
# others are what the review is for.
extraction_valid: { min: 0.6 }
