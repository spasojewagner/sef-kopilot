[project]
name = "sef-kopilot-api"
version = "0.1.0"
description = "SEF Kopilot HTTP API: validation, explanations, repairs and SEF demo integration for UBL 2.1 e-invoices."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Marko Spasojevic", email = "markospasojevic758@gmail.com" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Private :: Do Not Upload",
]
dependencies = [
  "einvoice-core",
  "fastapi>=0.162",
  "uvicorn[standard]>=0.54",
]

[tool.uv.sources]
einvoice-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sef_api"]
