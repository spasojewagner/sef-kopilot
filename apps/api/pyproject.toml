[project]
name = "sef-kopilot-api"
version = "0.6.0"
description = "SEF Kopilot HTTP API: validation, explanations, repairs and SEF demo integration for UBL 2.1 e-invoices."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Marko Spasojevic", email = "markospasojevic758@gmail.com" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Private :: Do Not Upload",
]
dependencies = [
  "einvoice-core",
  "alembic>=1.20",
  "argon2-cffi>=25.1",
  "arq>=0.28",
  "asyncpg>=0.32",
  "cryptography>=50",
  "email-validator>=2.3",
  "fastapi>=0.162",
  "httpx>=0.28",
  "mcp>=2.3,<3",
  "pillow>=13.0",
  "pydantic-settings>=2.16",
  "pyjwt>=2.15",
  "pypdfium2>=5.14",
  "sentry-sdk>=2.74",
  "sqlalchemy[asyncio]>=2.1.8",
  "uvicorn[standard]>=0.54",
]

[tool.uv.sources]
einvoice-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sef_api"]
