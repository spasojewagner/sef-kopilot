# Alembic configuration of the API database. From the repository root:
#
#   uv run alembic -c apps/api/alembic.ini upgrade head                 (or: make migrate)
#   uv run alembic -c apps/api/alembic.ini revision --autogenerate --rev-id 0002 -m "add ..."
#
# The database URL comes from DATABASE_URL (see .env.example), never from this file. Revision
# ids are four-digit sequence numbers, so the history reads in order (docs/adr/0011).

[alembic]
script_location = sef_api:migrations
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 60

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
